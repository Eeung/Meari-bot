version: '3.8'

services:
  bot:
    build: .
    container_name: meari-bot
    restart: always
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DOWNLOAD_SECRET=${DOWNLOAD_SECRET}
      - BASE_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./logs:/app/logs
    ports:
      - "3000:3000"
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: meari-tunnel
    command: tunnel run meari-bot
    restart: always
    volumes:
      - /etc/cloudflared:/etc/cloudflared